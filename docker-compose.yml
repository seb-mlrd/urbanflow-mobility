services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env.local
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:4-standalone
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./docker/adminer.css:/var/www/html/adminer.css:ro
    depends_on:
      postgres:
        condition: service_healthy

  otp:
    image: opentripplanner/opentripplanner:2.6.0
    # Premier démarrage : --build --save --serve (construit le graph depuis GTFS + OSM)
    # Démarrages suivants : --load --serve (charge le graph.obj déjà construit)
    command: ["--build", "--save", "--serve"]
    ports:
      - "8888:8080"
    environment:
      JAVA_OPTS: "-Xmx2G"
    volumes:
      - ./otp-data:/var/opentripplanner
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -X POST http://localhost:8080/otp/gtfs/v1 -H 'Content-Type: application/json' -d '{\"query\":\"{__typename}\"}' > /dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 15
      start_period: 180s

volumes:
  postgres-data:
  redis-data:
